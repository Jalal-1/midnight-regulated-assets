# node-modules, not PnP. Every upstream Midnight repo (midnight-js,
# midnight-wallet, compact-contracts, compact, dapp-connector-api) sets this,
# and the stack is full of WASM and native artifacts that PnP resolution fights.
nodeLinker: node-modules

# Keep the cache in-project so a clean checkout installs identically.
enableGlobalCache: false
compressionLevel: mixed
