# Midnight local stack for the Asset Dashboard — node + indexer + proof server.
#
# Requires Docker (docker.com). Start:
#
#   curl -fsSL https://midnight-asset-dashboard.pages.dev/localnet.yml -o midnight-localnet.yml
#   docker compose -f midnight-localnet.yml up -d
#
# Then switch the dashboard to "Local development". Reset the chain with:
#
#   docker compose -f midnight-localnet.yml down -v
#
# Versions match the dashboard's pinned Stagenet-compatible stack (Ledger RC3).

services:
  node:
    image: "midnightntwrk/midnight-node:2.0.0-rc.4"
    ports: ['9944:9944']
    environment:
      CFG_PRESET: 'dev'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  indexer:
    # The published image carries the full build suffix — the short release
    # name "4.4.0-rc.1" has no tag on Docker Hub.
    image: "midnightntwrk/indexer-standalone:4.4.0-rc.1"
    ports: ['8088:8088']
    depends_on:
      node:
        condition: service_healthy
    environment:
      APP__INFRA__NODE__URL: 'ws://node:9944'
      # Must match the dashboard's localnet network id, or wallet sync returns nothing.
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      # This indexer line spawns an SPO/bridge subtask unconditionally and kills
      # the process when it stops retrying. No opt-out flag exists, so the
      # reconnect delay is stretched to outlive any session.
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'dummy-no-spo-on-localnet'
      APP__INFRA__SPO_NODE__RECONNECT_MAX_DELAY: '24h'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s

  proof-server:
    image: "midnightntwrk/proof-server:9.0.0-rc.6"
    command: ['midnight-proof-server --verbose']
    ports: ['6300:6300']
    environment:
      RUST_BACKTRACE: 'full'
    # The image is a minimal build with no shell or curl, so any in-container
    # probe fails even while the server is serving. It is ready long before
    # node and indexer anyway.
    healthcheck:
      disable: true
